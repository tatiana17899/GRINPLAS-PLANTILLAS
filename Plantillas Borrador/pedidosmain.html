<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css"
    />
    <link rel="stylesheet" href="stylePedido.css" />
  </head>
  <body>
    <div class="d-flex flex-column">
      <div class="container p-6 m-2">
        <div class="d-flex align-items-center small">
          <a href="#" class="text-muted" style="text-decoration: none">
            Inicio
          </a>
          <span class="mx-2">/</span>
          <span class="fw-bold" style="color: #09c33d">Pedidos en línea</span>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-4">
        <h1 class="display-6 ps-5 fw-semibold fs-2">
          Historial de Pedidos en Línea
        </h1>
        <div
          class="bg-light p-3 d-flex align-items-center gap-4 me-5"
          style="border: #096623 2px solid; border-radius: 20px"
        >
          <i class="fas fa-money-bill-wave text-success"></i>
          <div class="d-flex align-items-center">
            <div class="text-center me-4">
              <p
                class="mb-0 fw-semibold"
                style="color: #096623; font-size: 15px"
              >
                Ganancia Total Bolsas
              </p>
              <p class="h4 fw-bold text-success mb-0">S/9000</p>
            </div>
            <div
              class="border-start border-success mx-3"
              style="height: 50px"
            ></div>
            <div class="text-center ms-4">
              <p
                class="mb-0 0 fw-semibold"
                style="color: #096623; font-size: 15px"
              >
                Ganancia Total Mangas
              </p>
              <p class="h4 fw-bold text-success mb-0">S/2300</p>
            </div>
          </div>
        </div>
      </div>
      <div
        class="mt-4 d-flex justify-content-between align-items-center ms-5 me-5"
      >
        <div class="d-flex gap-3 text-muted">
          <button class="btn text-success fw-bold p-0" id="filter-all">
            Todos
          </button>
          <button class="btn text-muted p-0" id="filter-espera">
            En espera
          </button>
          <button class="btn text-muted p-0" id="filter-entregado">
            Entregado
          </button>
          <button class="btn text-muted p-0" id="filter-proceso">
            Proceso
          </button>
        </div>
        <div class="d-flex gap-2">
          <div class="input-group border border-success rounded">
            <input type="date" class="form-control border-0" />
          </div>
          <span class="text-muted">a</span>
          <div class="input-group border border-success rounded">
            <input type="date" class="form-control border-0" />
          </div>
        </div>
      </div>
      <hr class="mt-2 ms-5 me-5" />
      <div class="mt-4 table-responsive ms-5 me-5">
        <table id="ordersTable" class="table table-bordered">
          <thead class="table-light">
            <tr>
              <th>Id</th>
              <th>Cliente</th>
              <th>Dirección</th>
              <th>Boleta</th>
              <th>Fecha Emisión</th>
              <th>Fecha Entrega</th>
              <th>Estado</th>
              <th>Total</th>
              <th>Pago</th>
              <th>Comprobante de pago</th>
            </tr>
          </thead>
          <tbody>
            <tr class="rounded alignt-items-center">
              <td>#129</td>
              <td>Julio Alexander</td>
              <td>Calle Cruz del Sur</td>
              <td>
                <button class="btn btn-light border-0">
                  <i class="fas fa-external-link-alt text-success"></i>
                </button>
              </td>
              <td>7/01/2025</td>
              <td>24/01/2025</td>
              <td>
                <select
                  class="form-select form-select-sm fw-semibold text-white"
                >
                  <option
                    value="espera"
                    style="
                      background-color: rgba(19, 155, 57, 0.71);
                      color: white;
                    "
                    selected
                  >
                    En espera
                  </option>
                  <option
                    value="proceso"
                    style="background-color: #b5b5b5; color: white"
                  >
                    En proceso
                  </option>
                  <option
                    value="entregado"
                    style="background-color: #e1b877; color: white"
                  >
                    Entregado
                  </option>
                  <option
                    value="entregado"
                    style="background-color: #ef6264; color: white"
                  >
                    Cancelado
                  </option>
                </select>
              </td>
              <td>s/10.00</td>
              <td>
                <select
                  class="form-select form-select-sm fw-semibold text-white"
                >
                  <option
                    value="confirmado"
                    style="background-color: #ffffff"
                    selected
                  >
                    ✅
                  </option>
                  <option value="revision" style="background-color: #ffffff">
                    ⏳
                  </option>
                  <option value="rechazado" style="background-color: #ffffff">
                    ❌
                  </option>
                </select>
              </td>
              <td>
                <button class="btn btn-light border-0">
                  <i class="fas fa-external-link-alt text-success"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
  </body>
</html>
