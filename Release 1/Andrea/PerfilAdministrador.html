<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenida Administrador</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="stylePerfil.css" />
  </head>
  <body>
    <div class="container container-custom shadow-sm">
      <div class="left-section">
        <p class="text-muted mb-1">Inicio</p>
        <h2 class="fw-bold">
          ¡Bienvenido Administrador<br />
          <span class="text-success">Nicanor Guevara!</span>
        </h2>

        <div class="mt-4">
          <input
            type="text"
            class="form-control mb-3"
            value="Nicanor Guevara"
            disabled
          />
          <input
            type="email"
            class="form-control mb-4"
            value="nicanorguevara332@gmail.com"
            disabled
          />

          <button class="btn btn-custom">Cerrar Sesión</button>
        </div>
      </div>

      <div class="right-section text-center">
        <img
          src="https://i.imgur.com/5Nq9J7t.png"
          alt="Avatar Administrador"
          class="profile-img"
        />
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
