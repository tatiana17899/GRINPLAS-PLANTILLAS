<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Productos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css"
    />
    <link rel="stylesheet" href="styleProductos.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="d-flex flex-column">
      <div class="d-flex flex-column">
        <div class="d-flex">
          <!-- Main Content -->
          <div class="content" id="content">
            <div class="container" style="padding: 40px">
              <div class="text-sm mb-4">
                <a href="#" style="color: #7f7f7f; text-decoration: none"
                  >Inicio</a
                >
                <span class="mx-2">/</span>
                <span style="color: #09c33d; font-weight: bold">Productos</span>
              </div>
              <h1 class="fs-2 mb-4">Historial de Productos</h1>
              <div class="rounded-lg overflow-hidden">
                <div
                  class="d-flex justify-content-end align-items-center mb-3 gap-2"
                >
                  <label for="categoriaFiltro" class="form-label mb-0"
                    >Categoría:</label
                  >
                  <select
                    id="categoriaFiltro"
                    class="form-select form-select-sm"
                    style="width: auto"
                  >
                    <option value="">Todas</option>
                    <option value="categoría 1">Categoría 1</option>
                    <option value="categoría 2">Categoría 2</option>
                    <option value="categoría 3">Categoría 3</option>
                  </select>
                </div>
                <table id="producTable" class="table table-striped">
                  <thead class="table-light">
                    <tr>
                      <th scope="col">Id</th>
                      <th scope="col">Imagen</th>
                      <th scope="col">Nombres</th>
                      <th scope="col">Descripción</th>
                      <th scope="col">Categoría</th>
                      <th scope="col">Precio</th>
                      <th scope="col">Cantidad</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>imagen 1</td>
                      <td>nombres 1</td>
                      <td>descripción 1</td>
                      <td>categoría 1</td>
                      <td>precio</td>
                      <td>cantidad</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="producto.js"></script>
  </body>
</html>
