<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos - Grinplas</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styleVenta.css" />
    <!--Font Awesome-->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header con imagen -->
    <div class="header-container">
      <img
        src="https://storage.googleapis.com/a1aa/image/Zd7ibhMaiKLnGZRfHf8zS871gP0VEUbwy664t3aCRhN8WxHUA.jpg"
        alt="Imagen de encabezado"
      />
      <div class="productos-titulo">
        NUESTROS <span class="text-success">PRODUCTOS</span>
      </div>
    </div>

    <div class="container mt-5">
      <div class="row">
        <div class="col-md-4">
          <div
            class="producto-card"
            style="background-color: rgba(0, 0, 0, 0.05)"
          >
            <img
              src="https://storage.googleapis.com/a1aa/image/Zd7ibhMaiKLnGZRfHf8zS871gP0VEUbwy664t3aCRhN8WxHUA.jpg"
              alt="Imagen de encabezado"
              height="220px"
              width="220px"
            />
            <h5>PLÁSTICO COLOR ROJO</h5>
            <p>Descripción de plástico de color rojo, jsjs no sé qué decir</p>
            <div class="precio-container">
              <p class="precio">S/10.00</p>
              <button
                class="btn-compra"
                data-bs-toggle="modal"
                data-bs-target="#compraModal"
              >
                <i class="fas fa-shopping-cart carrito-icono"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="compraModal"
      tabindex="-1"
      aria-labelledby="compraModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <img
              src="https://storage.googleapis.com/a1aa/image/Zd7ibhMaiKLnGZRfHf8zS871gP0VEUbwy664t3aCRhN8WxHUA.jpg"
              alt="Producto"
            />
            <div class="modal-info">
              <h5 style="font-weight: bold">PLÁSTICO COLOR ROJO</h5>
              <p>
                Descripción de plástico de color rojo, jsjs no sé qué decir (1
                millar)
              </p>
              <p style="color: rgba(59, 59, 59, 0.71); font-size: 10px">
                Medida: 16x20x5
              </p>
              <div class="d-flex">
                <p
                  class="precio"
                  style="font-weight: bold; font-size: 30px; color: #3b3b3b"
                >
                  S/12.00
                </p>
                <div class="cantidad-container" style="margin-left: 30%">
                  <button>-</button>
                  <span>1</span>
                  <button>+</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-success d-flex">
              <i
                class="fas fa-shopping-cart carrito-icono"
                style="margin-right: 10px"
              ></i>
              Confirmar Compra
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const cantidadSpan = document.querySelector(".cantidad-container span");
        const btnMenos = document.querySelector(
          ".cantidad-container button:first-child"
        );
        const btnMas = document.querySelector(
          ".cantidad-container button:last-child"
        );

        let cantidad = 1;

        btnMas.addEventListener("click", function () {
          cantidad++;
          cantidadSpan.textContent = cantidad;
        });

        btnMenos.addEventListener("click", function () {
          if (cantidad > 1) {
            cantidad--;
            cantidadSpan.textContent = cantidad;
          }
        });
      });
    </script>
  </body>
</html>
